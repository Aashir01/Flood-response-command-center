[project]
name = "stitch"
version = "0.1.0"
description = "Stitch flood-response command center (workspace root)"
requires-python = ">=3.12,<3.13"
readme = "README.md"
license = { text = "MIT" }
dependencies = []

[dependency-groups]
dev = [
    "stitch-common[testing,mcp]",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.112",
    "jsonschema>=4.23",
    "types-jsonschema>=4.23",
    "ruff>=0.7",
    "mypy>=1.13",
    "pyyaml",
    "types-pyyaml",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.uv.workspace]
members = ["packages/*", "organs/*", "brain"]
# uv rejects member dirs without a pyproject.toml. scripts/scaffold_organ.py removes an organ
# from this list when it creates the organ.
exclude = [
    "organs/eyes",
    "organs/library",
    "organs/voice",
]

[tool.uv.sources]
stitch-common = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".kiro", "*.md"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF012"]

[tool.ruff.lint.isort]
known-first-party = [
    "stitch_common",
    "stitch_eyes",
    "stitch_oracle",
    "stitch_library",
    "stitch_ledger",
    "stitch_voice",
    "stitch_brain",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = ["packages/stitch_common/src", "organs/ledger/src", "organs/oracle/src", "brain/src", "scripts", "scripts/hooks"]
explicit_package_bases = true
exclude = ["\\.kiro/templates/", "/tests/"]

[[tool.mypy.overrides]]
module = ["ortools", "ortools.*", "duckdb", "pyarrow", "pyarrow.*", "pandas", "pandas.*", "lightgbm", "lightgbm.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra --import-mode=importlib"
testpaths = ["packages", "tests", "organs", "evals", "brain"]
pythonpath = ["scripts", "scripts/hooks", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "allow_loopback: permit 127.0.0.1 sockets (HTTP smoke tests)",
    "live: needs the network; excluded from CI",
    "integration: drives real organ servers (stdio); skipped when unavailable",
]

