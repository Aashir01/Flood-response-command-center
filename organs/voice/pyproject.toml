[project]
name = "stitch-voice"
version = "0.1.0"
description = "Voice organ (voice-mcp) for Stitch"
requires-python = ">=3.12"
dependencies = ["stitch-common[mcp]", "httpx>=0.27", "faster-whisper>=1.1,<2"]

[tool.uv.sources]
stitch-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stitch_voice"]
