[project]
name = "stitch-eyes"
version = "0.1.0"
description = "Eyes organ (eyes-mcp) for Stitch: Sentinel-1 flood segmentation (U-Net, ONNX on CPU)"
requires-python = ">=3.12"
dependencies = [
    "stitch-common[mcp]",
    "numpy>=1.26",
    "onnxruntime>=1.18",
    "rasterio>=1.4",
    "shapely>=2.0",
    "pyproj>=3.6",
    "scipy>=1.13",
]

[project.optional-dependencies]
# Training and export only (never in the runtime image). Torch comes from the CPU wheel index.
train = [
    "torch>=2.4",
    "torchvision>=0.19",
    "segmentation-models-pytorch>=0.3.4",
    "onnx>=1.16",
    "onnxconverter-common>=1.14",
    "pyyaml>=6",
]

[tool.uv.sources]
stitch-common = { workspace = true }
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stitch_eyes"]
