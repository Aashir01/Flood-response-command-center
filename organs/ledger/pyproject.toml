[project]
name = "stitch-ledger"
version = "0.1.0"
description = "Ledger organ (ledger-mcp) for Stitch"
requires-python = ">=3.12"
dependencies = ["stitch-common[mcp]", "ortools>=9.10", "duckdb>=1.0", "pyarrow>=16"]

[tool.uv.sources]
stitch-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stitch_ledger"]
