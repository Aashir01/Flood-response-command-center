[project]
name = "stitch-library"
version = "0.1.0"
description = "Library organ (library-mcp) for Stitch"
requires-python = ">=3.12"
dependencies = [
    "stitch-common[mcp,openai]",
    "numpy>=1.26",
    "onnxruntime>=1.18",
    "tokenizers>=0.19",
    "pypdfium2>=4.30",
    "pdfminer.six>=20231228",
    "pyarrow>=16",
    "pyyaml>=6",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
# Dev-time only: int8 export of the embedding model (scripts/export_models.py).
export = ["onnx>=1.16"]

[tool.uv.sources]
stitch-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stitch_library"]
