[project]
name = "stitch-oracle"
version = "0.1.0"
description = "Oracle organ (oracle-mcp) for Stitch: quantile forecasts of modeled GloFAS river discharge"
requires-python = ">=3.12"
dependencies = [
    "stitch-common[mcp]",
    "lightgbm>=4.5,<5",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16",
    "duckdb>=1.0",
]

[tool.uv.sources]
stitch-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stitch_oracle"]
