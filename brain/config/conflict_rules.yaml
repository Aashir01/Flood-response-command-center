# Conflict rules (brain design 9). Data, not code: rules name facts from
# stitch_brain.core.facts.FACTS, params below and constants. Schema:
# conflict_rules.schema.json (generated by `python -m stitch_brain.core.rules_schema`).
# Thresholds are judgement values with no empirical calibration (design 9.3); the eval reports
# recall on seeded scenarios and false positives on controls.
version: 1
params:
  oracle_low_p: 0.20      # "low" = modeled chance of exceeding the danger threshold < 1 in 5
  eyes_flooded_frac: 0.10 # a tenth of the basin districts' area mapped as new flood water
  eyes_dry_frac: 0.01     # below the segmentation noise floor; must equal severity f_noise
  need_rel_tol: 0.10      # guidance quantities are quoted to about two significant figures
rules:
  - id: R1_oracle_low_eyes_flooded
    severity: high
    organs: [oracle, eyes]
    facts: {p: oracle.max_exceedance, fl: eyes.basin_flooded_fraction}
    when: {all: [{lt: [p, {param: oracle_low_p}]}, {gte: [fl, {param: eyes_flooded_frac}]}]}
    affects: [forecast.peak, forecast.exceedance, extent.flood_area]
    describe: r1
    display: {p: pct, fl: pct, oracle_low_p: pct}
    reconcile: null
  - id: R2_ledger_to_dry_district
    severity: medium
    organs: [ledger, eyes]
    foreach: district_id
    facts: {alloc: ledger.allocated_units_by_district, ff: eyes.district_flooded_fraction}
    when: {all: [{gt: [alloc, {const: 0}]}, {lt: [ff, {param: eyes_dry_frac}]}]}
    affects: [allocation.summary]
    describe: r2
    display: {eyes_dry_frac: pct}
    reconcile: {action: rerun_ledger, severity_source: eyes_only, max_times: 1}
  - id: R3_library_vs_ledger_need
    severity: medium
    organs: [library, ledger]
    foreach: commodity_id
    facts: {lib: library.guidance_per_person_per_day, led: ledger.need_per_person_per_day}
    when: {rel_diff_gt: [lib, led, {param: need_rel_tol}]}
    affects: [allocation.summary]
    describe: r3
    display: {lib: dec, led: dec, need_rel_tol: pct}
    reconcile: null
