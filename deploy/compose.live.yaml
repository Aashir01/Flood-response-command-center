# Live override (deploy design 3.2, 3.5): adds the `egress` network (a normal bridge with an
# internet route) to the services that call external APIs: Brain (LLM), Oracle (Open-Meteo),
# Library (LLM answers, optional), Eyes and Voice (hosted TTS). Demo mode stays the default per
# request; keys come from prod.env. Nothing else gains outbound access.
#   docker compose -f compose.yaml -f deploy/compose.live.yaml up -d --wait
services:
  brain:
    networks: [core, egress]
  oracle:
    networks: [core, egress]
  library:
    networks: [core, egress]
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      NEBIUS_API_KEY: ${NEBIUS_API_KEY:-}
      NEBIUS_BASE_URL: ${NEBIUS_BASE_URL:-}
  eyes:
    networks: [core, egress]
  voice:
    networks: [core, egress]
    environment:
      # Deepgram: Nova-3 transcription, Aura-2 English speech. The key is useless without
      # egress. Fallbacks inside the organ: STT to local Whisper, English TTS to the
      # prerendered cache; Urdu TTS needs Azure, else the prerendered cache, else the text.
      STITCH_TTS_PROVIDER: ${STITCH_TTS_PROVIDER:-deepgram}
      STITCH_STT_PROVIDER: ${STITCH_STT_PROVIDER:-deepgram}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      AZURE_SPEECH_KEY: ${AZURE_SPEECH_KEY:-}
      AZURE_SPEECH_REGION: ${AZURE_SPEECH_REGION:-}

networks:
  egress: {}
