# Library demo questions: the guidance questions the Brain asks for demo-sindh-2022 and
# demo-sindh-2022-conflicts (brain/config/scenarios.yaml guidance_questions, en and ur; the
# conflicts scenario extends the first and asks the same questions). Shared with the brain spec.
# `expected` is what the committed corpus supports, checked by the fake-model end-to-end test for
# the envelope and invariants and by the replay test against the recorded LLM replies.
#
# The committed corpus is FEMA Ready.gov and US EPA household guidance, an excerpt of the
# USAID/OFDA Field Operations Guide (food rations, shelter; added 2026-11-17) and team-authored
# Urdu translations of both. Before the FOG excerpt the food questions were refused
# (INSUFFICIENT_EVIDENCE) and the shelter questions fell under the evidence gate.
- id: water
  lang: en
  query: "How much drinking water does each person need per day in a flood emergency?"
  expected: answered
  eval_id: q001
- id: water
  lang: ur
  query: "سیلاب کی ہنگامی صورتحال میں ہر شخص کو روزانہ کتنا پینے کا پانی چاہیے؟"
  expected: answered
  eval_id: q031
- id: food
  lang: en
  query: "What food ration should displaced flood-affected families receive?"
  expected: answered
  eval_id: q024
- id: food
  lang: ur
  query: "سیلاب سے بے گھر خاندانوں کو کتنا خوراک کا راشن ملنا چاہیے؟"
  expected: answered
  eval_id: q046
- id: shelter
  lang: en
  query: "What emergency shelter should be provided to families displaced by floods?"
  expected: answered
  eval_id: q002
- id: shelter
  lang: ur
  query: "سیلاب سے بے گھر خاندانوں کو کیسی ہنگامی پناہ گاہ دی جائے؟"
  expected: answered
  eval_id: q032
