# Stitch: the whole system from committed demo data (deployment design 3).
#   docker compose up -d --wait                       core stack: Postgres, Library, Ledger, Oracle,
#                                                     Brain, web gateway on http://localhost/
#   docker compose --profile full up -d --wait        plus Eyes and Voice (set STITCH_ORGANS_DISABLED=)
#   docker compose -f compose.yaml -f deploy/compose.lite.yaml up -d      small hosts (< 4 GB)
#   docker compose -f compose.yaml -f deploy/compose.live.yaml up -d      live mode (egress)
#   docker compose -f compose.yaml -f deploy/compose.prod.yaml --env-file /opt/stitch/prod.env ...
# Defaults: STITCH_MODE=demo, STITCH_LLM_PROVIDER=fake, no keys, no outbound network for any
# service except the gateway (ACME). Organs and Postgres sit on the internal `core` network.
name: stitch

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs:
    - /tmp:size=64m,mode=1777

x-python-health: &python-health
  test:
    - CMD
    - python
    - -c
    - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status == 200 else 1)"
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 20s

x-organ-env: &organ-env
  STITCH_MODE: ${STITCH_MODE:-demo}
  STITCH_LLM_PROVIDER: ${STITCH_LLM_PROVIDER:-fake}
  STITCH_HOST: 0.0.0.0
  STITCH_PORT: "8000"
  STITCH_LAZY_LOAD: ${STITCH_LAZY_LOAD:-1}
  OMP_NUM_THREADS: "2"
  HOME: /tmp

x-library-build: &library-build
  context: .
  dockerfile: deploy/docker/python.Dockerfile
  target: library
  args:
    PACKAGE: stitch-library
    SRC_DIR: organs/library
  additional_contexts:
    localmodels: ${STITCH_MODELS_CONTEXT:-deploy/docker/empty}

services:
  init-secrets:
    image: alpine:3.24.4@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf
    network_mode: none
    user: "0:0"
    command: ["/bin/sh", "/init-secrets.sh"]
    volumes:
      - secrets:/secrets
      - ./deploy/docker/init-secrets.sh:/init-secrets.sh:ro
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER]
    security_opt: ["no-new-privileges:true"]
    restart: "no"
    logging: *logging
    deploy:
      resources:
        limits: { memory: 32M, cpus: "0.25" }

  postgres:
    image: pgvector/pgvector:0.8.7-pg16@sha256:484e838076e04939d27d3e176e91c86eea96236126023be8d3059761122e579f
    user: "999:999"
    command:
      - postgres
      - -c
      - shared_buffers=96MB
      - -c
      - max_connections=30
      - -c
      - work_mem=4MB
      - -c
      - password_encryption=scram-sha-256
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: stitch
      POSTGRES_PASSWORD_FILE: /secrets/pg_superuser_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=trust
    volumes:
      - pgdata:/var/lib/postgresql/data
      - secrets:/secrets:ro
      - ./deploy/docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    networks: [core]
    shm_size: 128m
    read_only: true
    tmpfs:
      - /tmp:size=64m
      - /var/run/postgresql:size=1m,uid=999,gid=999
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "stitch_owner", "-d", "stitch"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      init-secrets: { condition: service_completed_successfully }
    restart: unless-stopped
    logging: *logging
    deploy:
      resources:
        limits: { memory: 384M, cpus: "0.5" }

  seed:
    image: ${REGISTRY:-ghcr.io}/${GH_OWNER:-stitch-local}/stitch-library:${TAG:-local}
    build: *library-build
    user: "10002:10002"
    command: ["python", "/app/deploy/library_seed.py"]
    environment:
      <<: *organ-env
      STITCH_LIBRARY_STORE: pgvector
      STITCH_LIBRARY_DSN: postgresql://stitch_owner@postgres:5432/stitch?application_name=stitch-seed
      PGPASSFILE: /secrets/pgpass_owner
    volumes:
      - secrets:/secrets:ro
    networks: [core]
    <<: *hardening
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"
    logging: *logging
    deploy:
      resources:
        limits: { memory: 768M, cpus: "1.0" }

  library:
    image: ${REGISTRY:-ghcr.io}/${GH_OWNER:-stitch-local}/stitch-library:${TAG:-local}
    build: *library-build
    command: ["python", "-m", "stitch_library.server", "--http"]
    environment:
      <<: *organ-env
      STITCH_LIBRARY_STORE: pgvector
      STITCH_LIBRARY_DSN: postgresql://stitch_app@postgres:5432/stitch?application_name=stitch-library
      PGPASSFILE: /secrets/pgpass_app
      STITCH_EMBED_MODEL: ${STITCH_EMBED_MODEL:-}
      STITCH_RERANK_MODEL: ${STITCH_RERANK_MODEL:-}
      STITCH_LIB_THREADS: "2"
    volumes:
      - secrets:/secrets:ro
    networks: [core]
    <<: *hardening
    healthcheck:
      <<: *python-health
      start_period: 90s
    depends_on:
      postgres: { condition: service_healthy }
      seed: { condition: service_completed_successfully }
    restart: unless-stopped
    logging: *logging
    deploy:
      resources:
        limits: { memory: 832M, cpus: "1.0" }

  ledger:
    image: ${REGISTRY:-ghcr.io}/${GH_OWNER:-stitch-local}/stitch-ledger:${TAG:-local}
    build:
      context: .
      dockerfile: deploy/docker/python.Dockerfile
      target: runtime
      args: { PACKAGE: stitch-ledger, SRC_DIR: organs/ledger }
    command: ["python", "-m", "stitch_ledger.server", "--http"]
    environment:
      <<: *organ-env
    networks: [core]
    <<: *hardening
    healthcheck: *python-health
    restart: unless-stopped
    logging: *logging
    deploy:
      resources:
        limits: { memory: 256M, cpus: "1.0" }

  oracle:
    image: ${REGISTRY:-ghcr.io}/${GH_OWNER:-stitch-local}/stitch-oracle:${TAG:-local}
    build:
      context: .
      dockerfile: deploy/docker/python.Dockerfile
      target: runtime
      args: { PACKAGE: stitch-oracle, SRC_DIR: organs/oracle }
    command: ["python", "-m", "stitch_oracle.server", "--http"]
    environment:
      <<: *organ-env
    networks: [core]
    <<: *hardening
    healthcheck: *python-health
    restart: unless-stopped
    logging: *logging
    deploy:
      resources:
        limits: { memory: 320M, cpus: "0.5" }

  # Optional organs (profiles `eyes`, `voice`, `full`). Not started by a plain `docker compose up`;
  # the Brain then reports them `disabled` (STITCH_ORGANS_DISABLED defaults to eyes,voice).
  eyes:
    profiles: [eyes, full]
    image: ${REGISTRY:-ghcr.io}/${GH_OWNER:-stitch-local}/stitch-eyes:${TAG:-local}
    build:
      context: .
      dockerfile: deploy/docker/python.Dockerfile
      target: runtime
      args: { PACKAGE: stitch-eyes, SRC_DIR: organs/eyes }
    command: ["python", "-m", "stitch_eyes.server", "--http"]
    environment:
      <<: *organ-env
      STITCH_IDLE_UNLOAD_S: "120"
    networks: [core]
    <<: *hardening
    healthcheck:
      <<: *python-health
      start_period: 60s
    restart: unless-stopped
    logging: *logging
    deploy:
      resources:
        limits: { memory: 640M, cpus: "1.5" }

  voice:
    profiles: [voice, full]
    image: ${REGISTRY:-ghcr.io}/${GH_OWNER:-stitch-local}/stitch-voice:${TAG:-local}
    build:
      context: .
      dockerfile: deploy/docker/python.Dockerfile
      target: runtime
      args: { PACKAGE: stitch-voice, SRC_DIR: organs/voice }
    command: ["python", "-m", "stitch_voice.server", "--http"]
    environment:
      <<: *organ-env
      STITCH_TTS_PROVIDER: ${STITCH_TTS_PROVIDER:-prerendered}
      STITCH_WHISPER_MODEL: ${STITCH_WHISPER_MODEL:-base}
      STITCH_IDLE_UNLOAD_S: "300"
      AZURE_SPEECH_KEY: ${AZURE_SPEECH_KEY:-}
      AZURE_SPEECH_REGION: ${AZURE_SPEECH_REGION:-}
    volumes:
      - voice_cache:/var/cache/stitch-voice
    networks: [core]
    <<: *hardening
    healthcheck:
      <<: *python-health
      start_period: 60s
    restart: unless-stopped
    logging: *logging
    deploy:
      resources:
        limits: { memory: 640M, cpus: "1.5" }

  brain:
    image: ${REGISTRY:-ghcr.io}/${GH_OWNER:-stitch-local}/stitch-brain:${TAG:-local}
    build:
      context: .
      dockerfile: deploy/docker/python.Dockerfile
      target: runtime
      args: { PACKAGE: stitch-brain, SRC_DIR: brain }
    command: ["python", "-m", "stitch_brain.api", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: *organ-env
      STITCH_BRAIN_ORGANS_FILE: /app/brain/config/organs.compose.yaml
      STITCH_ORGANS_DISABLED: ${STITCH_ORGANS_DISABLED-eyes,voice}
      STITCH_TRUSTED_PROXY: "1"
      STITCH_CORS_ORIGINS: https://stitch.aashirnoman.dev,http://localhost,http://127.0.0.1
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    networks: [core]
    <<: *hardening
    healthcheck: *python-health
    depends_on:
      library: { condition: service_healthy }
      ledger: { condition: service_healthy }
      oracle: { condition: service_healthy }
      eyes: { condition: service_healthy, required: false }
      voice: { condition: service_healthy, required: false }
    restart: unless-stopped
    logging: *logging
    deploy:
      resources:
        limits: { memory: 320M, cpus: "0.5" }

  web:
    image: ${REGISTRY:-ghcr.io}/${GH_OWNER:-stitch-local}/stitch-web:${TAG:-local}
    build:
      context: .
      dockerfile: deploy/docker/web.Dockerfile
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-80}:8080"
    environment:
      HSTS: ${HSTS:-max-age=300}
    networks: [edge, core]
    <<: *hardening
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      brain: { condition: service_healthy }
    restart: unless-stopped
    logging: *logging
    deploy:
      resources:
        limits: { memory: 64M, cpus: "0.25" }

networks:
  core:
    internal: true
  edge: {}
  # `egress` (normal bridge) is added by deploy/compose.live.yaml only.

volumes:
  secrets: {}
  pgdata: {}
  voice_cache: {}
