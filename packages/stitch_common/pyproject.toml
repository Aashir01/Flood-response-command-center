[project]
name = "stitch-common"
version = "0.1.0"
description = "Shared Pydantic contract models, envelope, provenance and test helpers for Stitch"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7"]

[project.optional-dependencies]
testing = ["pytest>=8.3", "pytest-socket>=0.7", "hypothesis>=6.112", "jsonschema>=4.23"]

[project.entry-points.pytest11]
stitch_common = "stitch_common.testing.plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stitch_common"]
