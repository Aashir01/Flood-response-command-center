name: ci
# Deployment design 9.1 (DEP-R5, DEP-R10.2). Third-party actions are pinned by commit SHA.
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
      - name: Repo hygiene (.kiro guard, MCP settings, tracked secrets, MANIFEST, files, THIRD_PARTY)
        run: >
          uv run --no-project python deploy/bin/check_repo_hygiene.py
          --third-party ${{ github.ref == 'refs/heads/main' && 'strict' || 'advisory' }}
      - name: Compose config for every override combination
        run: |
          set -e
          for combo in "" "-f deploy/compose.lite.yaml" "-f deploy/compose.live.yaml" \
                       "-f deploy/compose.prod.yaml" "-f deploy/compose.lite.yaml -f deploy/compose.prod.yaml" \
                       "-f deploy/compose.ci.yaml"; do
            echo "compose.yaml $combo"
            docker compose --profile full -f compose.yaml $combo config -q
          done
      - name: Port and network audit (DEP-P4)
        run: uv run --no-project python deploy/bin/check_ports.py
      - name: Caddyfiles validate
        run: |
          set -e
          echo 'header Content-Security-Policy "default-src '"'self'"'"' > /tmp/csp.caddy
          for f in Caddyfile Caddyfile.prod; do
            docker run --rm --network none \
              -v "$PWD/deploy/caddy:/etc/caddy:ro" -v /tmp/csp.caddy:/etc/caddy/snippets/csp.caddy:ro \
              -e SITE_ADDRESS=stitch.aashirnoman.dev \
              caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0 \
              caddy validate --config /etc/caddy/$f --adapter caddyfile
          done
      - name: Shell scripts (syntax and shellcheck)
        run: |
          set -e
          for f in deploy/bin/*.sh deploy/docker/*.sh deploy/docker/postgres/initdb/*.sh; do bash -n "$f"; done
          shellcheck -S warning deploy/bin/*.sh deploy/docker/init-secrets.sh deploy/docker/postgres/initdb/*.sh

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
      - name: Install
        run: uv sync --all-packages --frozen
      - name: Ruff lint
        run: uv run ruff check
      - name: Ruff format
        run: uv run ruff format --check
      - name: Mypy
        run: uv run mypy packages scripts evals
      - name: Mypy (deploy scripts)
        run: uv run mypy --strict deploy/bin/smoke.py deploy/bin/check_ports.py deploy/bin/check_images.py deploy/bin/check_repo_hygiene.py
      - name: Tests
        run: uv run pytest -q -m "not live" --hypothesis-profile=ci
      - name: Contract check
        run: uv run python scripts/check_contracts.py
      - name: Secret scan
        run: uv run python scripts/secret_scan.py --all
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Kiro directory guard (.kiro must be tracked, never ignored)
        run: |
          if git check-ignore -q .kiro; then
            echo "::error::.kiro is git-ignored"; exit 1
          fi
          if [ -z "$(git ls-files .kiro)" ]; then
            echo "::error::no tracked files under .kiro"; exit 1
          fi

  evals-smoke:
    runs-on: ubuntu-latest
    needs: python
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
      - run: uv sync --all-packages --frozen
      - name: Fast eval subset (fake LLM, fixed seed)
        run: uv run python -m evals.run --fast --seed 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: evals-results
          path: evals/results/
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Generated types are current
        run: npm run gen:types && git diff --exit-code -- src
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Static export and budget
        run: npm run build
      - name: Playwright (mock Brain, axe)
        run: npx playwright install --with-deps chromium && npx playwright test --project=mock
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report-mock
          path: frontend/test-results/
          if-no-files-found: ignore

  images:
    runs-on: ubuntu-latest
    needs: [hygiene]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Build every image (GHA layer cache)
        uses: docker/bake-action@37816e747588cb137173af99ab33873600c46ea8 # v6.8.0
        with:
          source: .
          files: deploy/docker-bake.hcl
          targets: all
          load: true
          set: |
            *.cache-from=type=gha,scope=stitch
            *.cache-to=type=gha,scope=stitch,mode=max
      - name: Image checks (size budgets, non-root, no torch, read-only import, caddy validate)
        run: python3 deploy/bin/check_images.py
      - name: Save images for the stack job
        run: |
          docker save $(docker image ls --format '{{.Repository}}:{{.Tag}}' | grep '/stitch-.*:local$') \
            | zstd -T0 -3 -o /tmp/stitch-images.tar.zst
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stitch-images
          path: /tmp/stitch-images.tar.zst
          retention-days: 1
          compression-level: 0

  stack-smoke:
    # DEP-R5.1, DEP-R10.2, DEP-P1, DEP-P5, DEP-P6. The organs, Brain and Postgres sit on an
    # internal network with no route out, so the stack runs offline by construction; the
    # negative control below proves it instead of assuming it.
    runs-on: ubuntu-latest
    needs: [images, frontend]
    timeout-minutes: 30
    env:
      COMPOSE_PROFILES: eyes
      STITCH_ORGANS_DISABLED: voice
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: stitch-images
          path: /tmp
      - run: zstd -dc /tmp/stitch-images.tar.zst | docker load
      - name: Start the stack (time to healthy, DEP-P1)
        run: |
          t0=$(date +%s)
          docker compose -f compose.yaml -f deploy/compose.ci.yaml up -d --no-build --wait --wait-timeout 420
          echo "time_to_healthy_s=$(( $(date +%s) - t0 ))" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Offline smoke (negative control, smoke.py, seed idempotence; DEP-P5, DEP-P6)
        run: bash deploy/bin/offline_smoke.sh http://127.0.0.1:8080
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Playwright against the stack (CSP, same-origin, demo briefing)
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          cp -r ../deploy/playwright tests-stack
          STACK_URL=http://127.0.0.1:8080 npx playwright test -c tests-stack/stack.config.ts
      - name: Logs on failure
        if: failure()
        run: docker compose -f compose.yaml -f deploy/compose.ci.yaml logs --no-color --tail 200
